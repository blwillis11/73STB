//	This is a model.cfg skeleton created for The Cole Protocol weapon systems.
//	Created by: Vespade

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	// Skeleton class with classname identical to CfgWeapons classname
	class STB73_arifle_AUG7: Default
	{
		isDiscrete = 0;
		skeletonInherit = "";
		skeletonBones[] = // Define selections for use inside of CfgModels >> Animations
		{
			"zasleh", "", // muzzleFlash selection
			"trigger", "",
			"bolt", "",
			"magazine", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit= "";
		sections[] = {};
		skeletonName = "";
	};

	// Classname with identical name as the .p3d file in this directory
	class AUG7: Default
	{
		htMin = 1;		// Minimum half-cooling time (in seconds)
		htMax = 600;	// Maximum half-cooling time (in seconds)
		afMax = 0;		// Maximum temperature in case the model is alive (in celsius)
		mfMax = 0;		// Maximum temperature when the model is moving (in celsius)
		mFact = 1;		// Metabolism factor - number from interval <0, 1> (0 - metabolism has no influence, 1 - metabolism has full influence (no other temperature source will be considered)).
		tBody = 100;	 // Metabolism temperature of the model (in celsius)

		skeletonName = "STB73_arifle_AUG7"; // Classname of the above skeleton class
		sectionsInherit	= "";
		sections[] =
		{
			"zasleh", // muzzleFlash
			"camo", // hiddenSelection
		};
		class Animations
		{
			// Muzzleflash Setup
			class muzzleFlash_Rotation
 			{
 				type = "rotationX";
 				source = "ammoRandom";			// Use ammo count as phase for animation
 				sourceAddress = "loop";			// Loop when phase out of bounds
	 			selection = "zasleh";				// Selection we want to rotate
 				axis = "";									// No own axis - center of rotation is computed from selection
 				centerFirstVertex = true;		// Use first vertex of selection as center of rotation
 				minValue = 0;
 				maxValue = 4;								// Rotation angle will be 360/4 = 90 degrees
 				angle0 = "rad 0";
 				angle1 = "rad 360";
 			};

			// Trigger Setup
			class trigger_Translation
			{
				type = "translation";
				source = "reload";
				sourceAddress = "clamp";
				selection = "trigger";
				axis = "trigger_axis";
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 1; // Translation of trigger (Scaled to the length of the axis. A good base is from the front of the bolt to the back.)
			};

			// Bolt Setup
			class boltFire_begin_Translation
			{
				type = "translation";
				source = "reload";
				selection = "bolt";
				axis = "bolt_axis";
				memory = 1;
				minValue = 0;
				maxValue = 0.3;
				offset0 = 0;
				offset1 = 1; // Translation of bolt (Scaled to the length of the axis. A good base is from the front of the bolt to the back.)
			};
			class boltFire_end_Translation: boltFire_begin_Translation
			{
				minValue = 0.5; // Occurs 0.2 after the beginning translation
				maxValue = 1.0;
				offset0 = 0;
				offset1 = -1; // Returns the bolt to the original position
			};

			// Magazine Setup
			class magazineEmpty_Hide
			{
				type = "hide";
				source = "hasMagazine";
				selection = "magazine";
				minValue = 0.000000;
				maxValue = 1.00000;
				hideValue = 0.5;
				unhideValue = -1.0;
			};

			class magazineReload_Hide
 			{
 				type = "hide";
 				source = "reloadMagazine";
 				selection = "magazine";
 				minValue = 0.000000;
 				maxValue = 1.00000;
 				hideValue = 0.220;
 				unhideValue = 0.550;
 			};

			class magazineReload_Translation1
 			{
 				type = "translation";
 				source = "reloadMagazine";
 				selection = "magazine";
 				axis = "magazine_axis";
 				minValue = 0.145;
 				maxValue = 0.170;
 				offset0 = 0.0;
 				offset1 = 0.5;
 			};
 			class magazineReload_Translation2
 			{
 				type = "translation";
 				source = "reloadMagazine";
 				selection = "magazine";
 				axis = "magazine_axis";
 				minValue = 0.550;
 				maxValue = 0.600;
 				offset0 = 0.0;
 				offset1 = -0.5;
 			};
		};
	};
};
